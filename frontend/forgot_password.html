<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Forgot Password — DHAS</title>
  <script src="js/config.js"></script>
  <script src="theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:ital,wght@0,600;0,700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0b1437;--blue:#2a6cf6;--teal:#00c9b1;--bg:#f0f4ff;--surface:#ffffff;--border:#e4e9f4;--text:#0d1b3e;--muted:#6b7fa3;--radius:20px;}
    body.dark{--bg:#07101f;--surface:#0f1c35;--border:#1a2d4a;--text:#dde9ff;--muted:#6a80a8;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);transition:background .35s;}
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;}
    .auth-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:0 20px 60px rgba(42,108,246,.1);width:100%;max-width:420px;overflow:hidden;}
    .card-brand{background:linear-gradient(145deg,#0b1437,#2a6cf6);padding:28px;text-align:center;}
    .brand-icon{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#2a6cf6,#00c9b1);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 24px rgba(42,108,246,.4);}
    .brand-icon svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;}
    .brand-title{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:4px;}
    .brand-sub{font-size:.8rem;color:rgba(255,255,255,.55);}
    .card-body{padding:28px;}
    .dhas-label{font-size:.71rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:7px;}
    .dhas-input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:.92rem;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;margin-bottom:14px;}
    .dhas-input:focus{border-color:#2a6cf6;box-shadow:0 0 0 4px rgba(42,108,246,.12);background:var(--surface);}
    body.dark .dhas-input{background:rgba(255,255,255,.04);color:#dde9ff;border-color:#1a2d4a;}
    .btn-primary{width:100%;padding:13px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;background:linear-gradient(135deg,#2a6cf6,#00c9b1);color:#fff;box-shadow:0 4px 20px rgba(42,108,246,.35);transition:all .22s;}
    .btn-primary:hover{transform:translateY(-1px);}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
    .alert{padding:11px 14px;border-radius:10px;font-size:.84rem;font-weight:600;margin-bottom:14px;display:none;}
    .alert.danger{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;display:block;}
    .alert.success{background:#d1fae5;border:1px solid #6ee7b7;color:#065f46;display:block;}
    body.dark .alert.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#fca5a5;}
    body.dark .alert.success{background:rgba(5,150,105,.12);border-color:rgba(5,150,105,.3);color:#6ee7b7;}
    .footer-note{text-align:center;font-size:.83rem;color:var(--muted);padding:0 28px 24px;}
    .footer-note a{color:#2a6cf6;font-weight:600;text-decoration:none;}
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="card-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
      </div>
      <div class="brand-title">Forgot Password</div>
      <div class="brand-sub">Patient account recovery</div>
    </div>
    <div class="card-body">
      <div id="errMsg" class="alert danger" style="display:none;"></div>
      <div id="okMsg"  class="alert success" style="display:none;"></div>
      <p style="font-size:.9rem;color:var(--muted);margin-bottom:18px;line-height:1.5;">
        Enter the email linked to your patient account. We will send a secure reset link (valid for 30 minutes).
      </p>
      <label class="dhas-label">Email Address</label>
      <input type="email" id="email" class="dhas-input" placeholder="you@example.com" autocomplete="email">
      <button id="btn" class="btn-primary" onclick="submitForgot()">Send reset link</button>
    </div>
    <div class="footer-note">
      <a href="login.html">Back to patient login</a>
    </div>
  </div>
</div>
<script>
async function submitForgot() {
  const email = document.getElementById("email").value.trim();
  const err   = document.getElementById("errMsg");
  const ok    = document.getElementById("okMsg");
  const btn   = document.getElementById("btn");
  err.style.display = "none";
  ok.style.display  = "none";

  if (!email) {
    err.textContent = "Please enter your email address.";
    err.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Sending…";

  try {
    const res  = await fetch(window.API_BASE + "/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if (data.success) {
      ok.textContent = data.message || "If an account exists, a reset link has been sent.";
      ok.style.display = "block";
    } else {
      err.textContent = data.message || "Something went wrong.";
      err.style.display = "block";
    }
  } catch (e) {
    err.textContent = "Cannot reach server. Please try again later.";
    err.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "Send reset link";
  }
}
</script>
</body>
</html>
