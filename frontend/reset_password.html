<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Reset Password — DHAS</title>
  <script src="js/config.js"></script>
  <script src="theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:ital,wght@0,600;0,700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0b1437;--blue:#2a6cf6;--teal:#00c9b1;--bg:#f0f4ff;--surface:#ffffff;--border:#e4e9f4;--text:#0d1b3e;--muted:#6b7fa3;--radius:20px;}
    body.dark{--bg:#07101f;--surface:#0f1c35;--border:#1a2d4a;--text:#dde9ff;--muted:#6a80a8;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);transition:background .35s;}
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;}
    .auth-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:0 20px 60px rgba(42,108,246,.1);width:100%;max-width:420px;overflow:hidden;}
    .card-brand{background:linear-gradient(145deg,#0b1437,#0f766e);padding:28px;text-align:center;}
    .brand-icon{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#0f766e,#00c9b1);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 24px rgba(15,118,110,.4);}
    .brand-icon svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;}
    .brand-title{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:4px;}
    .brand-sub{font-size:.8rem;color:rgba(255,255,255,.55);}
    .card-body{padding:28px;}
    .dhas-label{font-size:.71rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:7px;}
    .dhas-input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:.92rem;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;margin-bottom:14px;}
    .dhas-input:focus{border-color:#0f766e;box-shadow:0 0 0 4px rgba(15,118,110,.12);background:var(--surface);}
    body.dark .dhas-input{background:rgba(255,255,255,.04);color:#dde9ff;border-color:#1a2d4a;}
    .btn-primary{width:100%;padding:13px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;background:linear-gradient(135deg,#0f766e,#00c9b1);color:#fff;box-shadow:0 4px 20px rgba(15,118,110,.35);transition:all .22s;}
    .btn-primary:hover{transform:translateY(-1px);}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
    .alert{padding:11px 14px;border-radius:10px;font-size:.84rem;font-weight:600;margin-bottom:14px;display:none;}
    .alert.danger{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;display:block;}
    .alert.success{background:#d1fae5;border:1px solid #6ee7b7;color:#065f46;display:block;}
    body.dark .alert.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#fca5a5;}
    body.dark .alert.success{background:rgba(5,150,105,.12);border-color:rgba(5,150,105,.3);color:#6ee7b7;}
    .hint{font-size:.75rem;color:var(--muted);margin-top:-8px;margin-bottom:14px;line-height:1.4;}
    .req-list{list-style:none;padding:0;margin:0 0 14px;font-size:.75rem;}
    .req-list li{display:flex;align-items:center;gap:6px;color:var(--muted);margin-bottom:3px;}
    .req-list li::before{content:"✗";font-weight:700;color:#e74c3c;min-width:14px;}
    .req-list li.ok{color:#27ae60;}
    .req-list li.ok::before{content:"✓";color:#27ae60;}
    .footer-note{text-align:center;font-size:.83rem;color:var(--muted);padding:0 28px 24px;}
    .footer-note a{color:#0f766e;font-weight:600;text-decoration:none;}
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="card-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <div class="brand-title">Set new password</div>
      <div class="brand-sub" id="roleSub">Choose a strong password</div>
    </div>
    <div class="card-body">
      <div id="errMsg" class="alert danger" style="display:none;"></div>
      <div id="okMsg"  class="alert success" style="display:none;"></div>

      <label class="dhas-label">New password</label>
      <input type="password" id="pw" class="dhas-input" placeholder="New password" autocomplete="new-password" oninput="evalStrength(this.value)">

      <ul class="req-list">
        <li id="req-len">At least 6 characters</li>
        <li id="req-upper">One uppercase letter (A–Z)</li>
        <li id="req-lower">One lowercase letter (a–z)</li>
        <li id="req-num">One number (0–9)</li>
        <li id="req-sym">One symbol (!@#$%^&amp;*)</li>
      </ul>

      <label class="dhas-label">Confirm password</label>
      <input type="password" id="pw2" class="dhas-input" placeholder="Confirm password" autocomplete="new-password">

      <button id="btn" class="btn-primary" onclick="submitReset()">Update password</button>
    </div>
    <div class="footer-note">
      <a id="backLink" href="login.html">← Back to login</a>
    </div>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const token  = params.get("token");
const type   = (params.get("type") || "patient").toLowerCase();

if (type === "doctor") {
  document.getElementById("roleSub").textContent = "Doctor account";
  document.getElementById("backLink").href = "doctor_login.html";
} else {
  document.getElementById("roleSub").textContent = "Patient account";
  document.getElementById("backLink").href = "login.html";
}

if (!token) {
  const err = document.getElementById("errMsg");
  err.textContent = "Invalid or missing reset link.";
  err.style.display = "block";
  document.getElementById("btn").disabled = true;
}

const RULES = {
  len:   v => v.length >= 6,
  upper: v => /[A-Z]/.test(v),
  lower: v => /[a-z]/.test(v),
  num:   v => /[0-9]/.test(v),
  sym:   v => /[^A-Za-z0-9]/.test(v)
};

function evalStrength(val) {
  Object.keys(RULES).forEach(k => {
    document.getElementById("req-" + k)?.classList.toggle("ok", RULES[k](val));
  });
}

function isStrong(val) {
  return Object.values(RULES).every(fn => fn(val));
}

async function submitReset() {
  const pw  = document.getElementById("pw").value;
  const pw2 = document.getElementById("pw2").value;
  const err = document.getElementById("errMsg");
  const ok  = document.getElementById("okMsg");
  const btn = document.getElementById("btn");
  err.style.display = "none";
  ok.style.display  = "none";

  if (!token) {
    err.textContent = "Invalid or missing reset link.";
    err.style.display = "block";
    return;
  }
  if (!isStrong(pw)) {
    err.textContent = "Password does not meet strength requirements.";
    err.style.display = "block";
    return;
  }
  if (pw !== pw2) {
    err.textContent = "Passwords do not match.";
    err.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Updating…";

  const endpoint = type === "doctor" ? "/doctor/reset-password" : "/reset-password";

  try {
    const res  = await fetch(window.API_BASE + endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, new_password: pw })
    });
    const data = await res.json();

    if (data.success) {
      ok.textContent = data.message || "Password updated. Redirecting to login…";
      ok.style.display = "block";
      setTimeout(() => {
        window.location.href = type === "doctor" ? "doctor_login.html" : "login.html";
      }, 1800);
    } else {
      err.textContent = data.message || "Reset failed.";
      err.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Update password";
    }
  } catch (e) {
    err.textContent = "Cannot reach server. Please try again.";
    err.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Update password";
  }
}
</script>
</body>
</html>
